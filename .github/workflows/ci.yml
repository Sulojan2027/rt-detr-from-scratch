name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ scripts/ tests/

      - name: Run fast unit tests
        # Keep this fast: shape checks + module-level tests on tiny synthetic
        # inputs only. Full COCO training/eval should NOT run in CI.
        run: |
          pytest tests/ -v -m "not slow"

  # Optional: catch obvious formatting drift. Remove if too noisy for early-stage work.
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff format --check src/ scripts/ tests/
        continue-on-error: true
